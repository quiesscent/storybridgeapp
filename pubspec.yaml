name: story_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.3
  intl: ^0.19.0

  # Core state and navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  collection: ^1.18.0

  # Media and Hardware
  camera: ^0.11.0+2
  cross_file: ^0.3.5
  record: ^6.1.0
  video_player: ^2.8.6
  permission_handler: ^11.4.0
  share_plus: ^12.0.2
  image_picker: ^1.0.7
  url_launcher: ^6.2.6

  # Styling and UI packages
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.1

  # Advanced UI components
  lucide_icons: ^0.257.0
  path_provider: ^2.1.5
  firebase_core: ^3.15.2
  firebase_storage: ^12.4.5
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  chewie: ^1.8.5
  ffmpeg_kit_flutter_new: ^4.1.0
  http: ^1.6.0
  cached_network_image: ^3.4.1
  in_app_purchase: ^3.2.0
  cloud_functions: ^5.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.svg
    - assets/6i.svg
    - assets/main-logo.jpeg
    - assets/animations/
    - assets/story1.jpg
    - assets/story2.jpg
    - assets/story3.jpg
    - assets/story4.jpg
    - assets/story5.jpg
    - assets/story6.jpg
    - assets/story7.jpg
    - assets/story8.jpg
    # Ginger the Giraffe — individual declarations for reliable web manifest
    - assets/images/ginger/cover.jpg
    - assets/images/ginger/page_01.jpg
    - assets/images/ginger/page_02.jpg
    - assets/images/ginger/page_03.jpg
    - assets/images/ginger/page_04.jpg
    - assets/images/ginger/page_05.jpg
    - assets/images/ginger/page_06.jpg
    - assets/images/ginger/page_07.jpg
    - assets/images/ginger/page_08.jpg
    - assets/images/ginger/page_09.jpg
    - assets/images/ginger/page_10.jpg
    - assets/images/ginger/page_11.jpg
    - assets/images/ginger/page_12.jpg
    - assets/images/story_placeholder.png
    - assets/images/twinkle/
