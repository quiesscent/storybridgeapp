<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for gradients -->
  <defs>
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50" />
      <stop offset="100%" stop-color="#2E7D32" />
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8D6E63" />
      <stop offset="100%" stop-color="#A1887F" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F5F5F5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- The Story Bridge (glowing arch) -->
  <path d="M 96,360 C 96,180 416,180 416,360" fill="none" stroke="url(#bridgeGrad)" stroke-width="40" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Secondary inner arch for depth -->
  <path d="M 140,360 C 140,220 372,220 372,360" fill="none" stroke="#81C784" stroke-width="8" stroke-dasharray="16 12" stroke-linecap="round" />

  <!-- Left Page -->
  <path d="M 256,380 C 210,360 140,360 80,380 L 80,430 C 140,410 210,410 256,430 Z" fill="url(#pageGrad)" stroke="#3E2723" stroke-width="4" stroke-linejoin="round" />
  <!-- Right Page -->
  <path d="M 256,380 C 302,360 372,360 432,380 L 432,430 C 372,410 302,410 256,430 Z" fill="url(#pageGrad)" stroke="#3E2723" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Book spine / cover bottom -->
  <path d="M 76,432 C 140,412 210,412 256,432 C 302,432 372,412 436,432 L 440,438 C 372,418 302,418 256,438 C 210,438 140,418 72,438 Z" fill="url(#bookGrad)" stroke="#3E2723" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Sparkling Stars (connecting stories and family) -->
  <!-- Star 1 (Top Left) -->
  <path d="M 180,180 L 185,195 L 200,195 L 187,205 L 192,220 L 180,210 L 168,220 L 173,205 L 160,195 L 175,195 Z" fill="#FFF176" />
  <!-- Star 2 (Top Center) -->
  <path d="M 256,120 L 262,138 L 280,138 L 265,150 L 271,168 L 256,156 L 241,168 L 247,150 L 232,138 L 250,138 Z" fill="#FFD54F" />
  <!-- Star 3 (Top Right) -->
  <path d="M 332,180 L 337,195 L 352,195 L 339,205 L 344,220 L 332,210 L 320,220 L 325,205 L 312,195 L 327,195 Z" fill="#FFF176" />
  
  <!-- Little heart icon in the center of the book -->
  <path d="M 256,398 C 256,398 250,392 244,392 C 238,392 234,396 234,402 C 234,408 244,414 256,420 C 268,414 278,408 278,402 C 278,396 274,392 268,392 C 262,392 256,398 256,398 Z" fill="#E53935" />
</svg>
